<!DOCTYPE html>
<!-- index.html (放在 docs 目录下，用于 GitHub Pages 部署) -->
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Pages + Supabase</title>
    <!-- 引入 Supabase 客户端库 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 新增样式：用于数据展示 -->
    <style>
        #data-container { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; max-width: 900px; margin: 16px; }
        .todo-list { display: flex; flex-direction: column; gap: 10px; }
        .todo-item { padding: 10px 12px; border: 1px solid #e6e6e6; border-radius: 8px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
        .todo-title { font-weight: 600; font-size: 1.02rem; margin-bottom: 4px; color: #111827; }
        .todo-meta { font-size: 0.88rem; color: #6b7280; }
        .empty { color: #6b7280; }
    </style>
</head>

<body>
    <h1>Supabase 数据展示</h1>
    <div id="data-container"></div>

    <script>
        // 1. 初始化 Supabase 客户端
        const supabaseUrl = 'https://uobnsylxsbwydfyuixhk.supabase.co';
        const supabaseKey = 'sb_publishable_g3FSzEnIL14Hi07paFD4qA_imj6i9EZ';
        const client = supabase.createClient(supabaseUrl, supabaseKey);
        console.log('Supabase 客户端已初始化');
        // client.auth.getSession().then(({ data: { session } }) => {
        //     console.log('当前会话信息:', session);//null
        // });


        // 2. 调用 Supabase API 获取数据（示例：查询名为 "todos" 的表）
        async function fetchDataFromSupabase() {
            try {
                // 查询数据（替换成你的表名和查询条件）
                const { data, error } = await   client
                    .from('todos') // 你的表名
                    .select('*')    // 查询所有字段
                    .limit(10);     // 限制返回数量
                console.log('查询结果:', data, error);


                if (error) throw error;

                // 展示数据到页面（使用 div 列表展示）
                const container = document.getElementById('data-container');
                if (!data || data.length === 0) {
                    container.innerHTML = '<p class="empty">暂无数据</p>';
                    return;
                }

                // 清空并构建列表
                container.innerHTML = '';
                const list = document.createElement('div');
                list.className = 'todo-list';

                data.forEach(item => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'todo-item';

                    const title = document.createElement('div');
                    title.className = 'todo-title';
                    title.textContent = item.title ?? '(无标题)';

                    const meta = document.createElement('div');
                    meta.className = 'todo-meta';
                    const date = item.created_at ? new Date(item.created_at) : null;
                    meta.textContent = date ? date.toLocaleString() : '';

                    itemDiv.appendChild(title);
                    itemDiv.appendChild(meta);
                    list.appendChild(itemDiv);
                });

                container.appendChild(list);

                // ...existing code...

            } catch (error) {
                console.error('获取数据失败:', error.message);
                document.getElementById('data-container').innerHTML = `<p style="color: red;">获取数据失败：${error.message}</p>`;
            }
        }

        // 页面加载时执行
        window.onload = fetchDataFromSupabase;
    </script>
</body>

</html>

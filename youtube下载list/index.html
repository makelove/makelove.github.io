<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube 播放列表</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>YouTube 播放列表</h1>
    <form class="add-form" id="addForm">
        <input id="inputTitle" placeholder="视频标题" required>
        <input id="inputUrl" placeholder="YouTube URL" required>
        <button type="submit" class="btn-add">添加</button>
    </form>
    <div class="toolbar">
        <button class="btn-pop" id="btnPop">取出下一个</button>
        <button class="btn-refresh" id="btnRefresh">刷新</button>
    </div>
    <div class="list" id="list"></div>
</div>
<script src="app.js"></script>
</body>
</html>
